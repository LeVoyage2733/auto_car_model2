<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>농촌 자율주행 차량 호출 시스템</title>

  <!-- CSS: 고령자 친화적 인터페이스 구현 -->
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 3.5rem;
      color: #000000;
      text-align: center;
      margin-bottom: 40px;
    }
    .button-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 80%;
      max-width: 400px;
    }
    button {
      font-size: 2rem;
      font-weight: bold;
      padding: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.1s ease-in-out;
    }
    button:active {
      transform: scale(0.97);
    }
    .reserve-btn {
      background-color: #ffc107;
    }
    .check-btn {
      background-color: #2196F3;
    }
    footer {
      position: absolute;
      bottom: 30px;
      font-size: 0.9rem;
      color: #555;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>농촌 자율주행 차량<br>호출 시스템</h1>
  <div class="button-container">
    <button class="reserve-btn" onclick="goToReservation()">호출 예약</button>
    <button class="check-btn" onclick="goToCheck()">예약 확인</button>
  </div>
  <footer>
    프로그래밍 및 실습 © 농촌 자율주행 차량 호출 시스템 팀
  </footer>

  <!-- JS -->
  <script>
    function goToReservation() {
      // 호출 예약 화면으로 이동
      window.location.href = '호출예약';
    }
    function goToCheck() {
      // 예약 확인 화면으로 이동
      window.location.href = '예약확인';
    }
  </script>
</body>
</html>
