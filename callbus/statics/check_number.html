<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 예약 확인</title>

  <!-- CSS: 고령자 친화적 인터페이스 구현 -->
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      font-size: 3rem;
      color: #003366;
      text-align: center;
      margin-bottom: 40px;
    }

    .input-container {
      width: 100%;
      max-width: 540px;
      background-color: #f8f9fa;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    label {
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      display: block;
      margin-bottom: 15px;
      text-align: center;
    }

    input {
      width: 100%;
      font-size: 1.5rem;
      padding: 15px;
      border-radius: 10px;
      border: 2px solid #ccc;
      text-align: center;
      box-sizing: border-box;
    }

    .notice {
      font-size: 1.1rem;
      color: #525252;
      margin-top: 6px;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    button {
      margin-top: 35px;
      width: 100%;
      font-size: 2rem;
      font-weight: bold;
      padding: 18px;
      border: none;
      border-radius: 12px;
      color: black;
      background-color: #2196F3;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0079dc;
    }

    footer {
      position: absolute;
      bottom: 30px;
      font-size: 1rem;
      color: #666;
      text-align: center;
    }
  </style>
</head>

<body>
  <form   method='post' 
          action='/예약확인'
          enctype='application/x-www-form-urlencoded'>>
  <h1>📅 예약 확인</h1>

    <!-- 예약자 식별번호 확인 -->
    <div class="input-container">
      <label for="checkCode">예약자 식별번호를 입력하세요</label>
      <input type="text" name='checkcode' id="checkcode" placeholder="예: 1023-ABCD" maxlength="12" required>
      <p class="notice">※ 올바른 식별번호를 입력해야 예약 확인이 가능합니다.</p> <!-- 안내 문구 표시 -->
      <button type = 'submit' onclick="return goToResult()">확인</button>
    </div>

    <footer>
      프로그래밍 및 실습 © 농촌 자율주행 차량 호출 시스템 팀
    </footer>
  </form>
  

  <!-- JS -->
  <script>
    function goToResult() {
      // 식별번호를 입력했는지 확인
      const code = document.getElementById('checkcode').value.trim();
      if (code === '') {
        alert('식별번호를 입력해주세요.');
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
